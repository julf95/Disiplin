<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Rekod Disiplin Pelajar</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top, #1e293b 0%, #020617 55%);
  color: white;
  min-height: 100vh;
}

.container-main {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 25px 18px 60px;
}

.glass {
  background: rgba(15, 23, 42, 0.88);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 20px 50px rgba(0,0,0,.3);
  backdrop-filter: blur(12px);
}

.input-box {
  width: 100%;
  background: #020617;
  border: 1px solid #334155;
  border-radius: 14px;
  padding: 15px;
  color: white;
  outline: none;
  font-size: 16px;
}

.input-box:focus {
  border-color: #38bdf8;
}

.label {
  display: block;
  font-size: 13px;
  color: #94a3b8;
  margin-bottom: 7px;
  font-weight: bold;
}

.btn-main {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: none;
  background: #0284c7;
  color: white;
  font-weight: bold;
  cursor: pointer;
  font-size: 16px;
}

.btn-main:hover {
  background: #0369a1;
}

.student-suggestions {
  position: absolute;
  z-index: 100;
  width: 100%;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 12px;
  overflow: hidden;
  margin-top: 5px;
}

.student-option {
  padding: 13px 15px;
  cursor: pointer;
  border-bottom: 1px solid #1e293b;
}

.student-option:hover {
  background: #1e293b;
}

.record-card {
  border: 1px solid #334155;
  background: rgba(2,6,23,.75);
  border-radius: 16px;
  padding: 17px;
}

.small-label {
  font-size: 11px;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: bold;
}

.badge-green {
  background: rgba(34,197,94,.15);
  color: #4ade80;
}

.badge-yellow {
  background: rgba(234,179,8,.15);
  color: #facc15;
}

.badge-red {
  background: rgba(239,68,68,.15);
  color: #f87171;
}

.whatsapp {
  background: #16a34a;
}

.whatsapp:hover {
  background: #15803d;
}

.warning-btn {
  background: #b45309;
}

.warning-btn:hover {
  background: #92400e;
}

.hidden {
  display: none !important;
}

.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 500;
}

.modal {
  width: 100%;
  max-width: 420px;
  padding: 25px;
  border-radius: 20px;
}

.loading {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(2,6,23,.8);
  display: flex;
  align-items: center;
  justify-content: center;
}

.spinner {
  width: 42px;
  height: 42px;
  border: 4px solid #334155;
  border-top-color: #38bdf8;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.filter-btn {
  width: 100%;
  padding: 12px 8px;
  border-radius: 12px;
  border: 1px solid #334155;
  background: #0f172a;
  color: #94a3b8;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

.filter-btn:hover {
  background: #1e293b;
  color: white;
}

.filter-btn.active {
  background: #0284c7;
  border-color: #0284c7;
  color: white;
}

/* =========================================
   COMPACT KETUA DISIPLIN RECORDS
   ========================================= */

.records-table {
  width: 100%;
  overflow-x: auto;
  border: 1px solid #334155;
  border-radius: 14px;
}

.records-table-inner {
  min-width: 1050px;
}

.record-row {
  display: grid;
  grid-template-columns: 135px 1.5fr 55px 1.5fr 1fr 1.2fr 125px 110px;
  gap: 8px;
  align-items: center;
  padding: 9px 10px;
  border-bottom: 1px solid #1e293b;
  font-size: 12px;
}

.record-row:last-child {
  border-bottom: none;
}

.record-header {
  background: #0f172a;
  color: #64748b;
  font-size: 10px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: .04em;
}

.record-data {
  background: rgba(2, 6, 23, .55);
}

.record-data:hover {
  background: rgba(30, 41, 59, .7);
}

.record-name {
  font-weight: bold;
  color: white;
}

.record-muted {
  color: #94a3b8;
}

.record-cell {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.compact-btn {
  width: 100%;
  padding: 7px 6px;
  border-radius: 8px;
  border: none;
  color: white;
  font-size: 10px;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}

.compact-btn.whatsapp {
  background: #16a34a;
}

.compact-btn.whatsapp:hover {
  background: #15803d;
}

.compact-btn.warning-btn {
  background: #b45309;
}

.compact-btn.warning-btn:hover {
  background: #92400e;
}

.compact-badge {
  display: block;
  width: 100%;
  padding: 7px 5px;
  border-radius: 8px;
  text-align: center;
  font-size: 9px;
  font-weight: bold;
  white-space: nowrap;
}

.compact-badge.green {
  background: rgba(34,197,94,.15);
  color: #4ade80;
}

.compact-badge.red {
  background: rgba(239,68,68,.15);
  color: #f87171;
}

@media (max-width: 700px) {

  .records-table-inner {
      min-width: 1050px;
    }

  .record-row {
    font-size: 11px;
  }

}

/* =========================================
   BOTTOM ANDROID STYLE NAVIGATION
   ========================================= */

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 15px;
  transform: translateX(-50%);

  width: min(430px, calc(100% - 24px));

  display: grid;
  grid-template-columns: 1fr 1fr;

  background: rgba(15, 23, 42, .95);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 20px;

  padding: 6px;

  box-shadow:
    0 15px 40px rgba(0,0,0,.45);

  backdrop-filter: blur(15px);

  z-index: 800;
}

.nav-item {
  border: none;
  background: transparent;
  color: #64748b;

  padding: 9px 5px;

  border-radius: 15px;

  font-size: 10px;
  font-weight: bold;

  cursor: pointer;

  transition: .2s;
}

.nav-item:hover {
  color: white;
}

.nav-item.active {
  background: #0284c7;
  color: white;
}

.nav-icon {
  font-size: 18px;
  margin-bottom: 2px;
}

/* Give page some bottom room */
.container-main {
  padding-bottom: 110px;
}
</style>

</head>


<body>

<div id="recordPage">

  <!-- HEADER -->

      SISTEM SEKOLAH
    </div>

    <h1 class="text-3xl md:text-4xl font-black">

  <!-- TEACHER FORM -->

    <div class="flex items-center gap-3 mb-6">

    <!-- STUDENT -->

    <div class="mb-5">

      <select

        <option value="">

        <option value="">

        </option>

  <!-- ADMIN -->

      Memproses...
    </div>

  </div>

<script>

/****************************************************
 * IMPORTANT
 *
 * Replace this URL with your Apps Script Web App URL
 ****************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbxYsvdbZZVEiKTfz3T0Jb-cauEDyXg2jW1lW-PIsvSHCQofUzbWftucBndbKuMNctE1UQ/exec';


let students = [];

let selectedStudent = null;

let records = [];

let adminPassword = '';

let recordFilter = 'today';


// ==================================================
// INITIAL LOAD
// ==================================================

window.addEventListener('load', () => {

  loadStudents();

});


// ==================================================
// JSONP REQUEST
// ==================================================

function apiRequest(params, callback) {

  const callbackName =
    'jsonp_' + Date.now() + '_' +
    Math.floor(Math.random() * 10000);

  params.callback = callbackName;

  const query =
    Object.keys(params)
      .map(key =>
        encodeURIComponent(key) +
        '=' +
        encodeURIComponent(params[key])
      )
      .join('&');

  const script =
    document.createElement('script');

  window[callbackName] = function(data) {

    try {
      callback(data);
    } finally {

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    }

  };

  script.src =
    API_URL + '?' + query;

  script.onerror = function() {

    delete window[callbackName];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    hideLoading();

    alert(
      'Tidak dapat berhubung dengan sistem.'
    );

  };

  document.body.appendChild(script);

}


// ==================================================
// LOAD STUDENTS
// ==================================================

function loadStudents() {

  apiRequest(
    {
      action: 'students'
    },

    function(data) {

      if (!data.success) {

        alert(data.message);
        return;

      }

      students =
        data.students || [];

    }

  );

}


// ==================================================
// STUDENT SEARCH
// ==================================================

document
  .getElementById('studentInput')
  .addEventListener('input', function() {

    const query =
      this.value
        .trim()
        .toLowerCase();

    selectedStudent = null;

    document
      .getElementById('selectedStudent')
      .classList.add('hidden');

    if (!query) {

      document
        .getElementById('suggestions')
        .classList.add('hidden');

      return;

    }

    const matches =
      students
        .filter(s =>
          s.name
            .toLowerCase()
            .includes(query)
        )
        .slice(0, 10);

    const box =
      document.getElementById(
        'suggestions'
      );

    box.innerHTML = '';

    if (!matches.length) {

      box.classList.add('hidden');
      return;

    }

    matches.forEach(student => {

      const div =
        document.createElement('div');

      div.className =
        'student-option';

      div.innerHTML = `
        <div class="font-bold">
          ${escapeHtml(student.name)}
        </div>

        <div class="text-sm text-slate-400">
          ${escapeHtml(student.kelas)}
        </div>
      `;

      div.onclick = function() {

        selectStudent(student);

      };

      box.appendChild(div);

    });

    box.classList.remove('hidden');

  });


// ==================================================
// SELECT STUDENT
// ==================================================

function selectStudent(student) {

  selectedStudent = student;

  document
    .getElementById('studentInput')
    .value = student.name;

  document
    .getElementById('selectedName')
    .textContent = student.name;

  document
    .getElementById('selectedClass')
    .textContent =
      'Kelas ' + student.kelas;

  document
    .getElementById('selectedStudent')
    .classList.remove('hidden');

  document
    .getElementById('suggestions')
    .classList.add('hidden');

}


// ==================================================
// SAVE RECORD
// ==================================================

function saveRecord() {

  if (!selectedStudent) {

    alert(
      'Sila cari dan pilih nama murid terlebih dahulu.'
    );

    return;

  }

  const kesalahan =
    document.getElementById(
      'kesalahan'
    ).value;
    
  const tempat =
      document.getElementById(
        'tempat'
      ).value;

  const tindakan =
    document.getElementById(
      'tindakan'
    ).value;


  if (!kesalahan) {

    alert(
      'Sila pilih jenis kesalahan.'
    );

    return;

  }
  
  if (!tempat) {

      alert(
        'Sila pilih tempat kejadian.'
      );
    
      return;
    
    }


  if (!tindakan) {

    alert(
      'Sila pilih tindakan guru.'
    );

    return;

  }


  showLoading();


  apiRequest(

    {
      action: 'save',

      nama:
        selectedStudent.name,

      kelas:
        selectedStudent.kelas,

      kesalahan:
        kesalahan,
    
        tempat:
            tempat,

      tindakan:
        tindakan
    },

    function(data) {

      hideLoading();

      if (!data.success) {

        alert(data.message);
        return;

      }


      alert(
        '✓ Rekod disiplin berjaya disimpan.'
      );


      // RESET FORM

      selectedStudent = null;

      document
        .getElementById('studentInput')
        .value = '';

      document
        .getElementById('selectedStudent')
        .classList.add('hidden');

      document
        .getElementById('kesalahan')
        .value = '';
        
     document
      .getElementById('tempat')
      .value = '';

      document
        .getElementById('tindakan')
        .value = '';

    }

  );

}


// ==================================================
// ADMIN LOGIN
// ==================================================

function openAdminLogin() {

  document
    .getElementById('adminModal')
    .classList.remove('hidden');

  document
    .getElementById('adminPassword')
    .value = '';

  setTimeout(() => {

    document
      .getElementById('adminPassword')
      .focus();

  }, 100);

}


function closeAdminLogin() {

  document
    .getElementById('adminModal')
    .classList.add('hidden');

}


// ==================================================
// LOGIN
// ==================================================

function loginAdmin() {

  const password =
    document
      .getElementById('adminPassword')
      .value;

  if (!password) {

    alert('Sila masukkan password.');
    return;

  }

  showLoading();

  apiRequest(

    {
      action: 'records',
      password: password
    },

    function(data) {

      hideLoading();

      if (!data.success) {

        alert('Password salah.');
        return;

      }

      adminPassword = password;

      records =
        data.records || [];

      closeAdminLogin();

      adminPassword = password;

        records =
          data.records || [];
        
        closeAdminLogin();
        
        showAdminPage();

    }

  );

}


// ==================================================
// LOAD RECORDS
// ==================================================

function loadRecords() {

  showLoading();

  apiRequest(

    {
      action: 'records',
      password: adminPassword
    },

    function(data) {

      hideLoading();

      if (!data.success) {

        alert(data.message);
        return;

      }

      records =
        data.records || [];

      renderRecords();

    }

  );

}


// ==================================================
// RENDER RECORDS
// ==================================================

// ==================================================
// RECORD FILTER
// ==================================================

function setRecordFilter(filter) {

  recordFilter = filter;

  // Remove active from all buttons
  document
    .getElementById('filterAll')
    .classList.remove('active');

  document
    .getElementById('filterToday')
    .classList.remove('active');

  document
    .getElementById('filterWeek')
    .classList.remove('active');


  // Add active to selected button
  if (filter === 'all') {

    document
      .getElementById('filterAll')
      .classList.add('active');

  }

  if (filter === 'today') {

    document
      .getElementById('filterToday')
      .classList.add('active');

  }

  if (filter === 'week') {

    document
      .getElementById('filterWeek')
      .classList.add('active');

  }


  renderRecords();

}

function renderRecords() {

  const container =
    document.getElementById('recordsContainer');

  const search =
    document
      .getElementById('recordSearch')
      .value
      .trim()
      .toLowerCase();

  // ================================
  // DATE FILTER
  // ================================

  const now = new Date();

  // Today: 00:00:00
  const startToday = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

  // Monday of current week
  const day = now.getDay();
  const diffToMonday = day === 0 ? 6 : day - 1;

  const startWeek = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate() - diffToMonday
  );

  startWeek.setHours(0, 0, 0, 0);

  const filtered =
    records.filter(record => {

      // ================================
      // SEARCH FILTER
      // ================================

      const text =
        (
          record.nama + ' ' +
          record.kelas + ' ' +
          record.kesalahan + ' ' +
          record.tindakan
        ).toLowerCase();

      if (!text.includes(search)) {
        return false;
      }

      // ================================
      // DATE FILTER
      // ================================

      if (recordFilter === 'all') {
        return true;
      }

      // Convert timestamp from Google Sheet
      const recordDate = new Date(record.timestamp);

      // Invalid date = don't show
      if (isNaN(recordDate.getTime())) {
        return false;
      }

      if (recordFilter === 'today') {

        return recordDate >= startToday &&
               recordDate < new Date(
                 startToday.getTime() + 24 * 60 * 60 * 1000
               );

      }

      if (recordFilter === 'week') {

        return recordDate >= startWeek &&
               recordDate < new Date(
                 startWeek.getTime() + 7 * 24 * 60 * 60 * 1000
               );

      }

      return true;

    });


  // ================================
  // STATS
  // ================================

  document
    .getElementById('statTotal')
    .textContent =
      filtered.length;

  document
    .getElementById('statParent')
    .textContent =
      filtered.filter(r =>
        r.parent !== 'TELAH DIHANTAR'
      ).length;

  document
    .getElementById('statWarning')
    .textContent =
      filtered.filter(r =>
        r.warning === 'TELAH DIKELUARKAN'
      ).length;


  // ================================
  // EMPTY
  // ================================

  if (!filtered.length) {

    container.innerHTML = `

      <div class="text-center
                  text-slate-500
                  py-10">

        Tiada rekod dijumpai.

      </div>

    `;

    return;
  }


  // ================================
  // DISPLAY RECORDS
  // ================================

  container.innerHTML = `

      <div class="records-table">
    
        <div class="records-table-inner">
    
          <!-- HEADER -->
          <div class="record-row record-header">

              <div>TARIKH</div>
              <div>NAMA</div>
              <div>KELAS</div>
              <div>KESALAHAN</div>
              <div>TEMPAT</div>
              <div>TINDAKAN</div>
              <div>IBUBAPA</div>
              <div>AMARAN</div>
            
            </div>
    
          <!-- RECORDS -->
          ${filtered
            .map(record => createRecordHTML(record))
            .join('')}
    
        </div>
    
      </div>
    
    `;

}


// ==================================================
// RECORD CARD
// ==================================================

function createRecordHTML(record) {

  const parentSent =
    record.parent === 'TELAH DIHANTAR';

  const warningSent =
    record.warning === 'TELAH DIKELUARKAN';

  return `

    <div class="record-row record-data">

      <!-- TARIKH -->
      <div class="record-cell record-muted">
        ${escapeHtml(record.timestamp)}
      </div>

      <!-- NAMA -->
      <div class="record-cell record-name"
           title="${escapeHtml(record.nama)}">
        ${escapeHtml(record.nama)}
      </div>

      <!-- KELAS -->
      <div class="record-cell">
        ${escapeHtml(record.kelas)}
      </div>

      <!-- KESALAHAN -->
      <div class="record-cell"
           title="${escapeHtml(record.kesalahan)}">
        ${escapeHtml(record.kesalahan)}
      </div>
      
      <!-- TEMPAT -->
        <div class="record-cell record-muted"
             title="${escapeHtml(record.tempat)}">
          ${escapeHtml(record.tempat)}
        </div>

      <!-- TINDAKAN -->
      <div class="record-cell record-muted"
           title="${escapeHtml(record.tindakan)}">
        ${escapeHtml(record.tindakan)}
      </div>

      <!-- IBUBAPA -->
      <div>

        ${
          parentSent

          ?

          `
          <div class="compact-badge green">
            ✓ TELAH DIHANTAR
          </div>
          `

          :

          `
          <button
            onclick="sendParent(${record.row})"
            class="compact-btn whatsapp">

            📱 HANTAR

          </button>
          `
        }

      </div>

      <!-- AMARAN -->
      <div>

        ${
          warningSent

          ?

          `
          <div class="compact-badge red">
            ✓ DIKELUARKAN
          </div>
          `

          :

          `
          <button
            onclick="markWarning(${record.row})"
            class="compact-btn warning-btn">

            ⚠️ AMARAN

          </button>
          `
        }

      </div>

    </div>

  `;
}


// ==================================================
// SEND PARENT WHATSAPP
// ==================================================

function sendParent(row) {

  const record =
    records.find(r =>
      Number(r.row) === Number(row)
    );


  if (!record) {

    alert('Rekod tidak dijumpai.');
    return;

  }


  const student =
    students.find(s =>
      s.name.trim().toLowerCase() ===
      record.nama.trim().toLowerCase()
    );


  if (!student) {

    alert(
      'Nombor telefon ibu bapa untuk murid ini tidak dijumpai dalam Senarai.'
    );

    return;

  }


  let phone =
    String(student.phone || '')
      .replace(/\D/g, '');


  if (!phone) {

    alert(
      'Nombor HP ibu bapa belum diisi.'
    );

    return;

  }


  // Malaysia number
  if (phone.startsWith('0')) {
    phone =
      '6' + phone;
  }


  const message =

`Assalamualaikum dan salam sejahtera.

Dimaklumkan bahawa anak tuan/puan, *${record.nama}*, dari kelas *${record.kelas}*, telah direkodkan atas satu kesalahan disiplin.

*Jenis Kesalahan:*
${record.kesalahan}

*Tindakan Guru:*
${record.tindakan}

Kerjasama dan perhatian pihak tuan/puan amat dihargai bagi membantu membimbing anak kita ke arah disiplin yang lebih baik.

Terima kasih.

***Chat ini dihantar secara automatik dari sistem disiplin sekolah.`;


  const url =
    'https://wa.me/' +
    phone +
    '?text=' +
    encodeURIComponent(message);


  window.open(
    url,
    '_blank'
  );


  // Mark as sent after opening WhatsApp

  setTimeout(() => {

    markParent(row);

  }, 800);

}


// ==================================================
// MARK PARENT
// ==================================================

function markParent(row) {

  apiRequest(

    {
      action: 'markParent',
      password: adminPassword,
      row: row
    },

    function(data) {

      if (data.success) {

        const record =
          records.find(r =>
            Number(r.row) === Number(row)
          );

        if (record) {
          record.parent =
            'TELAH DIHANTAR';
        }

        renderRecords();

      }

    }

  );

}


// ==================================================
// MARK WARNING
// ==================================================

function markWarning(row) {

  if (!confirm(
    'Tandakan surat amaran sebagai telah dikeluarkan?'
  )) {
    return;
  }


  showLoading();


  apiRequest(

    {
      action: 'markWarning',
      password: adminPassword,
      row: row
    },

    function(data) {

      hideLoading();

      if (!data.success) {

        alert(data.message);
        return;

      }


      const record =
        records.find(r =>
          Number(r.row) === Number(row)
        );


      if (record) {

        record.warning =
          'TELAH DIKELUARKAN';

      }


      renderRecords();

    }

  );

}


// ==================================================
// LOADING
// ==================================================

function showLoading() {

  document
    .getElementById('loading')
    .classList.remove('hidden');

}


function hideLoading() {

  document
    .getElementById('loading')
    .classList.add('hidden');

}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(value) {

  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

// PAGE NAVIGATION
// ==================================================

function showRecordPage() {

  document
    .getElementById('recordPage')
    .classList.remove('hidden');

  document
    .getElementById('adminDashboard')
    .classList.add('hidden');

  document
    .getElementById('navRecord')
    .classList.add('active');

  document
    .getElementById('navAdmin')
    .classList.remove('active');

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

function handleAdminTab() {

  // Already authenticated during this session
  if (adminPassword) {
    showAdminPage();
    return;
  }

  // Not authenticated yet
  openAdminLogin();
}

function showAdminPage() {

  document
    .getElementById('recordPage')
    .classList.add('hidden');

  document
    .getElementById('adminDashboard')
    .classList.remove('hidden');

  document
    .getElementById('navRecord')
    .classList.remove('active');

  document
    .getElementById('navAdmin')
    .classList.add('active');

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });

  renderRecords();
}
