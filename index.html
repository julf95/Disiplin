<style>

* {

}

body {
  margin: 0;

.container-main {

  padding: 25px 18px 60px;
}

.glass {

  border: 1px solid rgba(255,255,255,0.08);

}

.input-box {

  padding: 15px;
  color: white;

  font-size: 16px;
}

  border-color: #38bdf8;

.label {

  font-size: 13px;

}

.btn-main {

.student-suggestions {

.record-card {

.small-label {

.badge {

.badge-green {

}

.badge-yellow {
  background: rgba(234,179,8,.15);

}

.badge-red {

}

.whatsapp {

}

}

.warning-btn {

.hidden {

.modal-bg {

<script>

/****************************************************
 * IMPORTANT
 *
 * Replace this URL with your Apps Script Web App URL
 ****************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbxYsvdbZZVEiKTfz3T0Jb-cauEDyXg2jW1lW-PIsvSHCQofUzbWftucBndbKuMNctE1UQ/exec';


let students = [];

let selectedStudent = null;

let records = [];

let adminPassword = '';

let recordFilter = 'today';

let monthlyChart = null;
let errorChart = null;


// ==================================================
// INITIAL LOAD
// ==================================================

window.addEventListener('load', () => {

  loadStudents();

});


// ==================================================
// JSONP REQUEST
// ==================================================

function apiRequest(params, callback) {

  const callbackName =
    'jsonp_' + Date.now() + '_' +
    Math.floor(Math.random() * 10000);

  params.callback = callbackName;

  const query =
    Object.keys(params)
      .map(key =>
        encodeURIComponent(key) +
        '=' +
        encodeURIComponent(params[key])
      )
      .join('&');

  const script =
    document.createElement('script');

  window[callbackName] = function(data) {

    try {
      callback(data);
    } finally {

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    }

  };

  script.src =
    API_URL + '?' + query;

  script.onerror = function() {

    delete window[callbackName];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    hideLoading();

    alert(
      'Tidak dapat berhubung dengan sistem.'
    );

  };

  document.body.appendChild(script);

}


// ==================================================
// LOAD STUDENTS
// ==================================================

function loadStudents() {
  const input = document.getElementById('studentInput');

  // Show loading status immediately
  input.disabled = true;
  input.placeholder = '🔄 Memuat senarai nama...';

  apiRequest(
    { action: 'students' },
    function(data) {
      if (!data.success) {
        input.disabled = false;
        input.placeholder = '❌ Gagal memuat. Taip untuk cuba lagi...';
        alert(data.message);
        return;
      }

      students = data.students || [];

      // Ready to search
      input.disabled = false;
      input.placeholder = 'Taip nama murid...';
    }
  );
}


// ==================================================
// STUDENT SEARCH
// ==================================================

document
  .getElementById('studentInput')
  .addEventListener('input', function() {

    const query =
      this.value
        .trim()
        .toLowerCase();

    selectedStudent = null;

    document
      .getElementById('selectedStudent')
      .classList.add('hidden');

    if (!query) {

      document
        .getElementById('suggestions')
        .classList.add('hidden');

      return;

    }

    const matches =
      students
        .filter(s =>
          s.name
            .toLowerCase()
            .includes(query)
        )
        .slice(0, 10);

    const box =
      document.getElementById(
        'suggestions'
      );

    box.innerHTML = '';

    if (!matches.length) {

      box.classList.add('hidden');
      return;

    }

    matches.forEach(student => {

      const div =
        document.createElement('div');

      div.className =
        'student-option';

      div.innerHTML = `
        <div class="font-bold">
          ${escapeHtml(student.name)}
        </div>

        <div class="text-sm text-slate-400">
          ${escapeHtml(student.kelas)}
        </div>
      `;

      div.onclick = function() {

        selectStudent(student);

      };

      box.appendChild(div);

    });

    box.classList.remove('hidden');

  });

// ==================================================
// SETUP ERROR YEAR
// ==================================================

function setupErrorYear() {

  const select =
    document.getElementById('errorYear');

  if (!select) return;

  const currentYear =
    new Date().getFullYear();

  const years = [];

  // Get years from records
  records.forEach(record => {

    if (!record.timestamp) return;

    const date =
      new Date(record.timestamp);

    if (isNaN(date.getTime())) return;

    const year =
      date.getFullYear();

    if (!years.includes(year)) {
      years.push(year);
    }

  });

  // Always include current year
  if (!years.includes(currentYear)) {
    years.push(currentYear);
  }

  years.sort((a, b) => b - a);

  const oldValue =
    select.value;

  select.innerHTML =
    years.map(year => `
      <option value="${year}">
        ${year}
      </option>
    `).join('');

  // Keep previous selection if possible
  if (years.includes(Number(oldValue))) {

    select.value = oldValue;

  } else {

    select.value = currentYear;

  }

}

// ==================================================
// SETUP ERROR WEEK
// MONDAY - FRIDAY
// ==================================================

function setupErrorWeek() {

  const monthSelect =
    document.getElementById('errorMonth');

  const yearSelect =
    document.getElementById('errorYear');

  const weekSelect =
    document.getElementById('errorWeek');

  if (
    !monthSelect ||
    !yearSelect ||
    !weekSelect
  ) return;

  const month =
    Number(monthSelect.value);

  const year =
    Number(yearSelect.value);

  const firstDay =
    new Date(year, month, 1);

  const lastDay =
    new Date(year, month + 1, 0);

  const weeks = [];

  // Find Monday on or before the first day
  let monday =
    new Date(firstDay);

  const day =
    monday.getDay();

  const diff =
    day === 0 ? -6 : 1 - day;

  monday.setDate(
    monday.getDate() + diff
  );


  // Generate Monday-Friday weeks
  while (monday <= lastDay) {

    const friday =
      new Date(monday);

    friday.setDate(
      friday.getDate() + 4
    );

    weeks.push({
      start: new Date(monday),
      end: friday
    });

    monday.setDate(
      monday.getDate() + 7
    );

  }


  weekSelect.innerHTML =
    weeks.map((week, index) => {

      return `
        <option value="${index}">
          Minggu ${index + 1}
          (${formatErrorDate(week.start)}-${formatErrorDate(week.end)})
        </option>
      `;

    }).join('');

}

function formatErrorDate(date) {

  const day =
    String(date.getDate())
      .padStart(2, '0');

  const month =
    String(date.getMonth() + 1)
      .padStart(2, '0');

  return `${day}/${month}`;

}

// ==================================================
// ERROR ANALYSIS PIE CHART
// ==================================================

function renderErrorChart() {

  const chartContainer =
    document.getElementById('errorChart');

  const legendContainer =
    document.getElementById('errorLegend');

  const monthSelect =
    document.getElementById('errorMonth');

  const yearSelect =
    document.getElementById('errorYear');

  if (
    !chartContainer ||
    !legendContainer ||
    !monthSelect ||
    !yearSelect
  ) return;


  const selectedMonth =
    Number(monthSelect.value);

  const selectedYear =
    Number(yearSelect.value);

    const weekSelect =
      document.getElementById('errorWeek');
    
    const selectedWeek =
      Number(weekSelect.value);
    
    const firstDay =
      new Date(
        selectedYear,
        selectedMonth,
        1
      );
    
    const day =
      firstDay.getDay();
    
    const diff =
      day === 0 ? -6 : 1 - day;
    
    const weekStart =
      new Date(firstDay);
    
    weekStart.setDate(
      weekStart.getDate() + diff
    );
    
    weekStart.setDate(
      weekStart.getDate() +
      (selectedWeek * 7)
    );
    
    const weekEnd =
      new Date(weekStart);
    
    weekEnd.setDate(
      weekEnd.getDate() + 4
    );
    
    weekStart.setHours(0, 0, 0, 0);
    weekEnd.setHours(23, 59, 59, 999);


  // Count each type of error

  const counts = {};

  records.forEach(record => {

    if (!record.timestamp) return;

    const date =
      new Date(record.timestamp);

    if (isNaN(date.getTime())) return;


    // Week filter
    // Monday - Friday
    
    if (
      date < weekStart ||
      date > weekEnd
    ) {
      return;
    }


    const error =
      String(record.kesalahan || '').trim();

    if (!error) return;


    if (!counts[error]) {
      counts[error] = 0;
    }

    counts[error]++;

  });


  const labels =
    Object.keys(counts);

  const values =
    labels.map(label => counts[label]);


  // Destroy previous chart

  if (errorChart) {

    errorChart.destroy();

    errorChart = null;

  }


  // No records

  if (!labels.length) {

    chartContainer.innerHTML = `
      <div class="h-full flex items-center justify-center
                  text-slate-500 text-sm">
        Tiada rekod kesalahan untuk bulan dan tahun ini.
      </div>
    `;

    legendContainer.innerHTML = '';

    return;

  }


  // Create canvas

  chartContainer.innerHTML = '';

  const canvas =
    document.createElement('canvas');

  chartContainer.appendChild(canvas);


  // Create pie chart

  errorChart =
    new Chart(canvas, {

      type: 'pie',

      data: {

        labels: labels,

        datasets: [

          {
            data: values,
        
            borderWidth: 2,
        
            borderColor: '#020617',
        
            backgroundColor: [
              '#38bdf8',
              '#f97316',
              '#a78bfa',
              '#22c55e',
              '#f43f5e',
              '#eab308',
              '#14b8a6',
              '#ec4899',
              '#8b5cf6',
              '#06b6d4',
              '#84cc16',
              '#fb7185',
              '#64748b'
            ]
        
          }
        
        ]

      },

      options: {

        responsive: true,

        maintainAspectRatio: false,

        plugins: {

          legend: {
            display: false
          },

          tooltip: {

            callbacks: {

              label: function(context) {

                const total =
                  context.dataset.data
                    .reduce(
                      (a, b) => a + b,
                      0
                    );

                const value =
                  context.parsed;

                const percentage =
                  ((value / total) * 100)
                    .toFixed(1);

                return (
                  ' ' +
                  context.label +
                  ': ' +
                  value +
                  ' rekod (' +
                  percentage +
                  '%)'
                );

              }

            }

          }

        }

      }

    });


  // Generate colour legend

  const colors =
    errorChart.data.datasets[0]
      .backgroundColor;


  legendContainer.innerHTML =
    labels.map((label, index) => {

      const value =
        values[index];

      const total =
        values.reduce(
          (a, b) => a + b,
          0
        );

      const percentage =
        ((value / total) * 100)
          .toFixed(1);

      const color =
        colors[index];


      return `

        <div
          class="flex items-center justify-between
                 rounded-xl bg-slate-800/70
                 px-3 py-2">

          <div class="flex items-center gap-2 min-w-0">

            <div
              style="
                width:12px;
                height:12px;
                min-width:12px;
                border-radius:50%;
                background:${color};
              ">
            </div>

            <div
              class="text-xs text-slate-300 truncate"
              title="${escapeHtml(label)}">

              ${escapeHtml(label)}

            </div>

          </div>

          <div
            class="text-xs font-bold text-white ml-2">

            ${value}
            <span class="text-slate-500">
              (${percentage}%)
            </span>

          </div>

        </div>

      `;

    }).join('');

}

function setRecordFilter(filter) {

  recordFilter = filter;

  // Remove active from all buttons
  document
    .getElementById('filterAll')
    .classList.remove('active');

  document
    .getElementById('filterToday')
    .classList.remove('active');

  document
    .getElementById('filterWeek')
    .classList.remove('active');


  // Add active to selected button
  if (filter === 'all') {

    document
      .getElementById('filterAll')
      .classList.add('active');

  }

  if (filter === 'today') {

    document
      .getElementById('filterToday')
      .classList.add('active');

  }

  if (filter === 'week') {

    document
      .getElementById('filterWeek')
      .classList.add('active');

  }


  renderRecords();

}

function renderRecords() {

  const container =
    document.getElementById('recordsContainer');

  const search =
    document
      .getElementById('recordSearch')
      .value
      .trim()
      .toLowerCase();

  // ================================
  // DATE FILTER
  // ================================

  const now = new Date();

  // Today: 00:00:00
  const startToday = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

  // Monday of current week
  const day = now.getDay();
  const diffToMonday = day === 0 ? 6 : day - 1;

  const startWeek = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate() - diffToMonday
  );

  startWeek.setHours(0, 0, 0, 0);

  const filtered =
    records.filter(record => {

      // ================================
      // SEARCH FILTER
      // ================================

      const text =
        (
          record.nama + ' ' +
          record.kelas + ' ' +
          record.kesalahan + ' ' +
          record.tindakan
        ).toLowerCase();

      if (!text.includes(search)) {
        return false;
      }

      // ================================
      // DATE FILTER
      // ================================

      if (recordFilter === 'all') {
        return true;
      }

      // Convert timestamp from Google Sheet
      const recordDate = new Date(record.timestamp);

      // Invalid date = don't show
      if (isNaN(recordDate.getTime())) {
        return false;
      }

      if (recordFilter === 'today') {

        return recordDate >= startToday &&
               recordDate < new Date(
                 startToday.getTime() + 24 * 60 * 60 * 1000
               );

      }

      if (recordFilter === 'week') {

        return recordDate >= startWeek &&
               recordDate < new Date(
                 startWeek.getTime() + 7 * 24 * 60 * 60 * 1000
               );

      }

      return true;

    });


  // ================================
  // STATS
  // ================================

  document
    .getElementById('statTotal')
    .textContent =
      filtered.length;

  document
    .getElementById('statParent')
    .textContent =
      filtered.filter(r =>
        r.parent !== 'TELAH DIHANTAR'
      ).length;

  document
    .getElementById('statWarning')
    .textContent =
      filtered.filter(r =>
        r.warning === 'TELAH DIKELUARKAN'
      ).length;


  // ================================
  // EMPTY
  // ================================

  if (!filtered.length) {

    container.innerHTML = `

      <div class="text-center
                  text-slate-500
                  py-10">

        Tiada rekod dijumpai.

      </div>

    `;

    return;
  }


  // ================================
  // DISPLAY RECORDS
  // ================================

  container.innerHTML = `

      <div class="records-table">
    
        <div class="records-table-inner">
    
          <!-- HEADER -->
          <div class="record-row record-header">

              <div>TARIKH</div>
              <div>NAMA</div>
              <div>KELAS</div>
              <div>KESALAHAN</div>
              <div>TEMPAT</div>
              <div>TINDAKAN</div>
              <div>IBUBAPA</div>
              <div>AMARAN</div>
            
            </div>
    
          <!-- RECORDS -->
          ${filtered
            .map(record => createRecordHTML(record))
            .join('')}
    
        </div>
    
      </div>
    
    `;

}

// ==================================================

function sendParent(row) {

  const record =
    records.find(r =>
      Number(r.row) === Number(row)
    );


  if (!record) {

    alert('Rekod tidak dijumpai.');
    return;

  }


  const student =
    students.find(s =>
      s.name.trim().toLowerCase() ===
      record.nama.trim().toLowerCase()
    );


  if (!student) {

    alert(
      'Nombor telefon ibu bapa untuk murid ini tidak dijumpai dalam Senarai.'
    );

    return;

  }


  let phone =
    String(student.phone || '')
      .replace(/\D/g, '');


  if (!phone) {

    alert(
      'Nombor HP ibu bapa belum diisi.'
    );

    return;

  }


  // Malaysia number
  if (phone.startsWith('0')) {
    phone =
      '6' + phone;
  }


  const message =

`🚨Assalamualaikum dan salam sejahtera.

Dimaklumkan bahawa anak tuan/puan, *${record.nama}*, dari kelas *${record.kelas}*, telah direkodkan atas satu kesalahan disiplin.

*Jenis Kesalahan:*
${record.kesalahan}

*Tindakan Guru:*
${record.tindakan}

Kerjasama dan perhatian pihak tuan/puan amat dihargai bagi membantu membimbing anak kita ke arah disiplin yang lebih baik.

Terima kasih.

***Chat ini dihantar secara automatik dari sistem *e-Disiplin SRAR.* `;


  const url =
    'https://wa.me/' +
    phone +
    '?text=' +
    encodeURIComponent(message);


  window.open(
    url,
    '_blank'
  );


  // Mark as sent after opening WhatsApp

  setTimeout(() => {

    markParent(row);

  }, 800);

}

// MARK PARENT
// ==================================================

function markParent(row) {

  apiRequest(

    {
      action: 'markParent',
      password: adminPassword,
      row: row
    },

    function(data) {

      if (data.success) {

        const record =
          records.find(r =>
            Number(r.row) === Number(row)
          );

        if (record) {
          record.parent =
            'TELAH DIHANTAR';
        }

        renderRecords();

      }

    }

  );

}


// ==================================================
// MARK WARNING
// ==================================================

function markWarning(row) {

  if (!confirm(
    'Tandakan surat amaran sebagai telah dikeluarkan?'
  )) {
    return;
  }


  showLoading();


  apiRequest(

    {
      action: 'markWarning',
      password: adminPassword,
      row: row
    },

    function(data) {

      hideLoading();

      if (!data.success) {

        alert(data.message);
        return;

      }


      const record =
        records.find(r =>
          Number(r.row) === Number(row)
        );


      if (record) {

        record.warning =
          'TELAH DIKELUARKAN';

      }


      renderRecords();

    }

  );

}


// ==================================================
// LOADING
// ==================================================

function showLoading() {

  document
    .getElementById('loading')
    .classList.remove('hidden');

}


function hideLoading() {

  document
    .getElementById('loading')
    .classList.add('hidden');

}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(value) {

  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

// ==================================================
// PAGE NAVIGATION
// ==================================================

function showRecordPage() {

  document
    .getElementById('recordPage')
    .classList.remove('hidden');

  document
    .getElementById('adminDashboard')
    .classList.add('hidden');

  document
    .getElementById('navRecord')
    .classList.add('active');

  document
    .getElementById('navAdmin')
    .classList.remove('active');

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

function handleAdminTab() {

  // Already authenticated during this session
  if (adminPassword) {
    showAdminPage();
    return;
  }

  // Not authenticated yet
  openAdminLogin();
}

function showAdminPage() {

  document
    .getElementById('recordPage')
    .classList.add('hidden');

  document
    .getElementById('adminDashboard')
    .classList.remove('hidden');

  document
    .getElementById('navRecord')
    .classList.remove('active');

  document
    .getElementById('navAdmin')
    .classList.add('active');

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });

  renderMonthlyChart();
  renderRecords();
}

</script>

     BOTTOM APP NAVIGATION

  </button>


  <button

      class="nav-item"
      onclick="handleAdminTab()">

    </button>

</div>
